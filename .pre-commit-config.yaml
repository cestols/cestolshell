repos:
  - repo: local
    hooks:
      - id: stylua
        name: stylua
        entry: stylua --check
        language: system
        types: [lua]
      - id: luacheck
        name: luacheck
        entry: luacheck
        language: system
        types: [lua]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: qmllint
        name: qmllint
        entry: qmllint
        language: system
        files: \.qml$
