# hyprlock.conf: lock screen, started by hypridle (lock_cmd)
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Clear the password: Esc, Ctrl+U, Ctrl+Backspace.

# Static M3 roles, same palette as hyprland/appearance.lua; matugen replaces them in 0.5.
$primary = rgb(aac7ff)
$on_surface = rgb(e2e2e9)
$on_surface_variant = rgb(c4c6d0)
$surface = rgb(121318)
$surface_container_high = rgb(282a2f)
$outline_variant = rgb(44464f)
$tertiary = rgb(dcbce0)
$error = rgb(ffb4ab)

$font = Inter

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 4, emphasizedDecel
    animation = fadeOut, 1, 3, emphasizedDecel
    animation = inputFieldDots, 1, 2, emphasizedDecel
}

# Blurred snapshot of the desktop; the shell wallpaper takes over in 0.5
background {
    monitor =
    path = screenshot
    color = $surface                              # shown until the screenshot is ready
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 96
    font_family = $font Light

    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = 20
    font_family = $font

    position = 0, 130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 56
    rounding = -1                                 # full pill
    outline_thickness = 2

    outer_color = $outline_variant
    inner_color = $surface_container_high
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    capslock_color = $tertiary

    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    position = 0, -40
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = 14
    font_family = $font

    position = 0, -100
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = $LAYOUT
    color = $on_surface_variant
    font_size = 12
    font_family = $font

    position = -30, 30
    halign = right
    valign = bottom
}
