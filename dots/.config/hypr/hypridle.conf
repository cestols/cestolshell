# hypridle.conf: idle timeouts (dim, lock, screen off, suspend) and lock on sleep
# Started by hyprland/execs.lua. Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock                                 # one instance only
    before_sleep_cmd = loginctl lock-session                              # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # screen on after resume
    inhibit_sleep = 3                                                     # delay sleep until the lock is up
}

# Dim the backlight (no-op without a backlight device)
listener {
    timeout = 150                                 # 2.5 min
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                                 # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                 # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800                                # 30 min
    on-timeout = systemctl suspend || loginctl suspend
}
